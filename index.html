<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Ameen Mobi Care</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fd;--card:#fff;--tx:#1e2140;--mu:#7a7f9a;--bd:#e3e6f2;--in:#f3f5fb;--pr:#5b4fe0;--g:linear-gradient(90deg,#8b5cf6,#06b6d4);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12142a;--card:#1b1e3a;--tx:#eceefd;--mu:#9aa0c4;--bd:#2c3058;--in:#23274a;--pr:#8f86ff;color-scheme:dark}}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:28px 16px}
.wide{max-width:1000px}
.logo{display:block;margin:0 auto;width:78%;max-width:280px;height:auto}
h1{text-align:center;color:var(--pr);margin:14px 0 4px;font-size:22px}
.bar{height:3px;width:44px;background:var(--g);margin:0 auto 20px;border-radius:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;box-shadow:0 6px 24px rgba(91,79,224,.08)}
label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin:0 0 6px}
label i{color:#e11d48;font-style:normal}.opt{margin-left:auto;font-weight:500;font-size:10px;background:var(--in);padding:2px 8px;border-radius:9px;color:var(--mu)}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:11px 12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
textarea{min-height:76px;resize:vertical}.f{margin-bottom:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#e11d48;font-size:11px;margin-top:4px;display:none}.bad input,.bad select,.bad textarea{border-color:#e11d48}.bad .err{display:block}
.btn{border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(90deg,#8b5cf6,#0ea5e9);cursor:pointer}
.btn.full{width:100%}.btn:disabled{opacity:.6}.btn.s{padding:7px 12px;font-size:12px}.btn.o{background:var(--in);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:#e11d48}
.foot{text-align:center;color:var(--mu);font-size:11px;margin-top:18px}.foot a{color:var(--mu)}
.ok{text-align:center;padding:20px 0}.ok .t{font-size:44px}.oid{font:700 20px ui-monospace,monospace;color:var(--pr);margin:8px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.top h2{margin:0;flex:1;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.st b{display:block;font-size:24px}.st span{color:var(--mu);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{flex:1;min-width:180px}.tools select{width:auto}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top;font-size:13px}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}
.pill{padding:3px 9px;border-radius:9px;font-size:11px;font-weight:600;background:#fde68a;color:#78350f}.pill.Printed{background:#ddd6fe;color:#4c1d95}.pill.Delivered{background:#bbf7d0;color:#14532d}.pill.Cancelled{background:#fecaca;color:#7f1d1d}
td select{padding:5px 8px;width:auto;font-size:12px}.mu{color:var(--mu)}.empty{text-align:center;padding:36px;color:var(--mu)}
.gate{text-align:center}.gate p{color:var(--mu)}
.lbl{display:none}
.ck{width:20px;height:20px;padding:0;accent-color:#6d5ae6}
.oc{background:var(--card);border:1px solid var(--bd);border-top:3px solid #f5b83d;border-radius:12px;padding:14px;margin-bottom:12px}
.oh{display:flex;align-items:flex-start;gap:10px}.on{flex:1}.on b{font-size:16px}.oh select{width:auto;padding:6px 8px;font-size:12px}
.ad{margin:12px 0 8px;font-size:14px}.ph{font-weight:600;margin-bottom:10px}.ph span{margin-right:14px}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.ch span{background:var(--in);border-radius:8px;padding:5px 10px;font-size:12px}
.ac{display:flex;gap:8px}.ac .btn{flex:1}.btn.dk{background:#1e2140}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.hd .sp{flex:1}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1e2140;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;display:none;z-index:9}
.st{text-align:center}
@media print{@page{size:A4;margin:8mm}body *{visibility:hidden}.lbl,.lbl *{visibility:visible}.lbl{display:block;position:absolute;left:0;top:0;width:100%}.pg{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6mm;height:281mm;page-break-after:always}.lb{border:1.5px dashed #000;padding:7mm;font-size:15px;line-height:1.5;color:#000;background:#fff;overflow:hidden}}

const LG='<img class="logo" alt="Al Ameen Mobi Care" src="'+LOGO+'">';
const STATES=["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Andaman & Nicobar","Chandigarh","Dadra & Nagar Haveli and Daman & Diu","Delhi","Jammu & Kashmir","Ladakh","Lakshadweep","Puducherry"];
const STATUS=["Pending","Printed","Delivered"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let orders=[],unsub=null,authUser=null,loaded=false,sel={};

onAuthStateChanged(auth,u=>{authUser=u;route()});
window.addEventListener("hashchange",route);
function route(){if(unsub){unsub();unsub=null}location.hash==="#admin"?admin():form()}

/* ---------- Customer form ---------- */
function field(id,lab,ctl,opt){return '<div class="f" id="f-'+id+'"><label>'+lab+(opt?'<span class="opt">Optional</span>':' <i>*</i>')+'</label>'+ctl+'<div class="err"></div></div>'}
function bad(id,msg){const f=$("#f-"+id);f.classList.add("bad");f.querySelector(".err").textContent=msg;return 1}
function form(){
 $("#app").innerHTML='<div class="wrap">'+LG+'<div class="bar" style="margin-top:14px"></div><form class="card" id="fm" novalidate>'+
 field("name","👤 Full Name",'<input id="name" placeholder="Enter your full name" autocomplete="name">')+
 field("addr","🏠 Address",'<textarea id="addr" placeholder="Enter your full address (House No, Street, Locality)"></textarea>')+
 '<div class="row">'+field("dist","📍 District",'<input id="dist" placeholder="Enter district">')+
 field("state","▦ State",'<select id="state"><option value="">Select state</option>'+STATES.map(s=>'<option>'+s+'</option>').join("")+'</select>')+'</div>'+
 field("pin","PIN Code",'<input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN code">')+
 '<div class="row">'+field("ph","📞 Phone Number",'<input id="ph" inputmode="tel" maxlength="10" placeholder="10-digit phone number">')+
 field("wht","💬 WhatsApp Number",'<input id="wht" inputmode="tel" maxlength="10" placeholder="10-digit WhatsApp number">')+'</div>'+
 field("rmrk","# Remarks",'<input id="rmrk" maxlength="60" placeholder="Remarks (optional)">',1)+
 '<button class="btn full" id="sub" type="submit">➤ Submit Order Details</button></form>'+
 '<div class="foot">© 2026 Al Ameen Mobi Care. All rights reserved. · <a href="#admin">Admin</a></div></div>';
 ["pin","ph","wht"].forEach(i=>$("#"+i).addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,"")));
 $("#fm").addEventListener("submit",submit);
}
async function submit(e){
 e.preventDefault();
 document.querySelectorAll(".bad").forEach(f=>f.classList.remove("bad"));
 const v={};["name","addr","dist","state","pin","ph","wht","rmrk"].forEach(i=>v[i]=$("#"+i).value.trim());
 let n=0;
 if(v.name.length<3)n+=bad("name","Please enter your full name");
 if(v.addr.length<10)n+=bad("addr","Please enter your full address");
 if(v.dist.length<2)n+=bad("dist","Enter district");
 if(!v.state)n+=bad("state","Select state");
 if(!/^[1-9]\d{5}$/.test(v.pin))n+=bad("pin","Enter a valid 6-digit PIN code");
 if(!/^[6-9]\d{9}$/.test(v.ph))n+=bad("ph","Enter a valid 10-digit phone number");
 if(!/^[6-9]\d{9}$/.test(v.wht))n+=bad("wht","Enter a valid 10-digit WhatsApp number");
 if(n)return;
 const btn=$("#sub");btn.disabled=true;btn.textContent="Submitting…";
 const id="AM"+Date.now().toString(36).toUpperCase().slice(-6)+Math.random().toString(36).slice(2,4).toUpperCase();
 try{
  await setDoc(doc(db,"orders",id),{orderId:id,name:v.name,address:v.addr,district:v.dist,state:v.state,pin:v.pin,phone:v.ph,whatsapp:v.wht,remarks:v.rmrk,status:"Pending",createdAt:Date.now()});
  $("#app").innerHTML='<div class="wrap">'+LG+'<div class="bar" style="margin-top:14px"></div><div class="card ok"><div class="t">✅</div><h2>Thank you, '+esc(v.name.split(" ")[0])+'!</h2><p class="mu">Your shipping details were received. Please keep your order ID:</p><div class="oid">'+id+'</div><button class="btn o" id="again">Submit another order</button></div></div>';
  $("#again").onclick=form;
 }catch(err){console.error(err);btn.disabled=false;btn.textContent="➤ Submit Order Details";alert("Could not submit. Please try again.")}
}

/* ---------- Admin ---------- */
function box(t,body){$("#app").innerHTML='<div class="wrap">'+LG+'<div class="bar" style="margin-top:14px"></div><div class="card"><h2 style="margin:0 0 16px;text-align:center">'+t+'</h2>'+body+'</div><div class="foot"><a href="#">← Order form</a></div></div>'}
function toast(m){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",1800)}
function admin(){
 if(authUser&&authUser.email===ADMIN_EMAIL)return dash();
 box("🔐 Admin login",field("au","👤 Username",'<input id="au" autocomplete="username">')+field("ap","🔑 Password",'<input id="ap" type="password" autocomplete="current-password">')+'<button class="btn full" id="lg">Login</button>');
 document.querySelectorAll("#app input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")$("#lg").click()});
 $("#lg").onclick=async()=>{
  document.querySelectorAll(".bad").forEach(f=>f.classList.remove("bad"));
  const u=$("#au").value.trim().toLowerCase(),p=$("#ap").value;
  if(!u||!p){bad("ap","Enter username and password");return}
  const b=$("#lg");b.disabled=true;
  try{await signInWithEmailAndPassword(auth,u.includes("@")?u:u+"@alameen.app",p)}
  catch(e){b.disabled=false;bad("ap","Wrong username or password")}
 };
}
function dash(){
 $("#app").innerHTML='<div class="wrap" style="max-width:640px"><div class="hd"><img class="logo" alt="" src="'+LOGO+'" style="margin:0;width:auto;height:40px"><span class="sp"></span><button class="btn s" id="pa">🖨 Print (4/A4)</button><button class="btn s" id="rf">⟳ Refresh</button><button class="btn s o" id="csv">⬇ CSV</button><button class="btn s o" id="lo">⎋ Logout</button></div><div class="stats" id="stats"></div><input id="q" placeholder="Search name, phone, PIN, district" style="margin-bottom:10px"><div class="tools"><select id="sf"><option value="">All</option>'+STATUS.map(x=>"<option>"+x+"</option>").join("")+'</select><button class="btn s" id="pn"></button><button class="btn s o" id="ca">⧉ Copy All</button></div><div class="mu" id="cnt" style="text-align:center;margin-bottom:12px;font-size:12px"></div><div id="list"></div><div class="foot"><a href="#">← Order form</a></div></div>';
 $("#sf").value="Pending";$("#q").oninput=draw;$("#sf").onchange=draw;$("#csv").onclick=exportCsv;
 $("#lo").onclick=()=>signOut(auth);
 $("#rf").onclick=()=>{if(unsub)unsub();dash()};
 $("#pa").onclick=()=>printLabels(orders.filter(o=>stt(o)==="Pending").map(o=>o.orderId));
 $("#pn").onclick=()=>{const k=Object.keys(sel).filter(i=>sel[i]);printLabels(k.length?k:vis().map(o=>o.orderId))};
 $("#ca").onclick=()=>{const l=vis();copy(l.map(info).join("\n\n"));toast(l.length+" copied")};
 if(unsub)unsub();
 unsub=onSnapshot(query(collection(db,"orders"),orderBy("createdAt","asc")),s=>{
  orders=s.docs.map(d=>d.data());orders.forEach((o,i)=>o.n=i+1);orders.reverse();loaded=true;draw();
 },err=>{console.error(err);$("#list").innerHTML='<div class="empty">Could not load orders. Check Firestore rules and that you are logged in.</div>'});
}
const stt=o=>o.status==="Printed"||o.status==="Delivered"?o.status:"Pending";
function vis(){const q=$("#q").value.toLowerCase(),f=$("#sf").value;return orders.filter(o=>(!f||stt(o)===f)&&(!q||[o.orderId,o.name,o.phone,o.whatsapp,o.pin,o.district,o.state,o.remarks].join(" ").toLowerCase().includes(q)))}
const info=o=>["Name: "+o.name,"Address: "+o.address,"District: "+o.district,"State: "+o.state,"PIN: "+o.pin,"Phone: "+o.phone,o.whatsapp?"WhatsApp: "+o.whatsapp:"",o.remarks?"Remarks: "+o.remarks:""].filter(Boolean).join("\n");
function copy(t){const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()};try{navigator.clipboard.writeText(t).catch(fb)}catch(e){fb()}}
async function setStatus(ids,status){const b=writeBatch(db);ids.forEach(id=>b.update(doc(db,"orders",id),{status}));await b.commit()}
function draw(){
 const c={Pending:0,Printed:0,Delivered:0};orders.forEach(o=>c[stt(o)]++);
 $("#stats").innerHTML=[["⊕","Total",orders.length],["⏳","Pending",c.Pending],["🖨","Printed",c.Printed],["📦","Delivered",c.Delivered]].map(a=>'<div class="st"><span>'+a[0]+' '+a[1]+'</span><b>'+a[2]+'</b></div>').join("");
 const list=vis(),ns=Object.keys(sel).filter(i=>sel[i]).length;
 $("#cnt").textContent="Showing "+list.length+" of "+orders.length;$("#pn").textContent="🖨 Print ("+(ns||list.length)+")";
 $("#list").innerHTML=list.length?list.map(o=>'<div class="oc"><div class="oh"><input type="checkbox" class="ck" data-k="'+esc(o.orderId)+'"'+(sel[o.orderId]?" checked":"")+'><div class="on"><b>#'+o.n+' '+esc(o.name)+'</b><div class="mu" style="font-size:12px">'+new Date(o.createdAt).toLocaleString()+'</div></div><select data-s="'+esc(o.orderId)+'">'+STATUS.map(x=>"<option"+(x===stt(o)?" selected":"")+">"+x+"</option>").join("")+'</select></div><div class="ad">'+esc(o.address)+'</div><div class="ph"><span>📞 '+esc(o.phone)+'</span>'+(o.whatsapp?'<span>💬 '+esc(o.whatsapp)+'</span>':'')+'</div><div class="ch"><span>📍 '+esc(o.district)+'</span><span>🗺 '+esc(o.state)+'</span><span>📮 '+esc(o.pin)+'</span></div>'+(o.remarks?'<div class="mu" style="margin-bottom:10px">📝 '+esc(o.remarks)+'</div>':'')+'<div class="ac"><button class="btn s" data-c="'+esc(o.orderId)+'">⧉ Copy Info</button><button class="btn s dk" data-p="'+esc(o.orderId)+'">🖨 Print Label</button><button class="btn s d" data-d="'+esc(o.orderId)+'" style="flex:0">🗑</button></div></div>').join(""):'<div class="empty">'+(loaded&&!orders.length?"No orders yet.":"No matching orders.")+'</div>';
 const by=id=>orders.find(o=>o.orderId===id);
 document.querySelectorAll(".ck").forEach(k=>k.onchange=()=>{sel[k.dataset.k]=k.checked;draw()});
 document.querySelectorAll("[data-s]").forEach(x=>x.onchange=()=>setStatus([x.dataset.s],x.value));
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{copy(info(by(b.dataset.c)));toast("Copied")});
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>printLabels([b.dataset.p]));
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("Delete this order permanently?"))deleteDoc(doc(db,"orders",b.dataset.d))});
}
const lab=o=>'<div class="lb"><b>SHIP TO</b><br><big><b>'+esc(o.name)+'</b></big><br>'+esc(o.address)+'<br>'+esc(o.district)+', '+esc(o.state)+'<br><b>PIN: '+esc(o.pin)+'</b><br>📞 '+esc(o.phone)+(o.whatsapp?' / WA '+esc(o.whatsapp):'')+(o.remarks?'<br>Note: '+esc(o.remarks):'')+'<hr><small>Order '+esc(o.orderId)+' · From: Al Ameen Mobi Care</small></div>';
async function printLabels(ids){
 const l=orders.filter(o=>ids.includes(o.orderId));
 if(!l.length){toast("No orders to print");return}
 let h="";for(let i=0;i<l.length;i+=4)h+='<div class="pg">'+l.slice(i,i+4).map(lab).join("")+'</div>';
 $("#lbl").innerHTML=h;window.print();
 if(confirm("Mark these "+l.length+" order(s) as Printed?")){await setStatus(ids,"Printed");sel={}}
}
function exportCsv(){
 const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
 const rows=[["Order ID","Date","Name","Address","District","State","PIN","Phone","WhatsApp","Remarks","Status"].map(q).join(",")].concat(orders.map(o=>[o.orderId,new Date(o.createdAt).toLocaleString(),o.name,o.address,o.district,o.state,o.pin,o.phone,o.whatsapp,o.remarks,stt(o)].map(q).join(",")));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));a.download="orders.csv";a.click();
}
</script></body></html>
